name: food_warehouse
version: "1.0.0"
config-version: 2

profile: food_warehouse

model-paths: ["models"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
test-paths: ["tests"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

models:
  food_warehouse:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts

seeds:
  food_warehouse:
    +schema: staging
    category_taxonomy:
      +column_types:
        category_l2: text
        category_l1: text
        description: text
    category_mapping:
      +column_types:
        off_category_tag: text
        category_l2: text
        priority: int
    nutrient_reference:
      +column_types:
        nutrient: text
        display_name: text
        standard_unit: text
        nutrient_group: text
        is_mass: boolean
