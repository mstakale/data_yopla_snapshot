name: food_warehouse
version: "1.0.0"
config-version: 2

profile: food_warehouse

model-paths: ["models"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
test-paths: ["tests"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

tests:
  food_warehouse:
    +store_failures: true
    +schema: audit

models:
  food_warehouse:
    +meta:
      owner: "Manisha Takale"
      source: "Open Food Facts, ODbL licence"
      classification: public
      contains_pii: false
    +persist_docs:
      relation: true
      columns: true
    staging:
      +materialized: view
      +schema: staging
      +tags: ["staging"]
    intermediate:
      +materialized: view
      +schema: intermediate
      +tags: ["intermediate"]
    marts:
      +materialized: table
      +schema: marts
      +tags: ["marts"]

seeds:
  food_warehouse:
    +schema: staging
    +persist_docs:
      relation: true
      columns: true
    category_taxonomy:
      +column_types:
        category_l2: text
        category_l1: text
        description: text
    category_mapping:
      +column_types:
        off_category_tag: text
        category_l2: text
        priority: int
    nutrient_reference:
      +column_types:
        nutrient: text
        display_name: text
        standard_unit: text
        nutrient_group: text
        is_mass: boolean
