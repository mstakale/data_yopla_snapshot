# Adds the warehouse Postgres alongside the Airflow containers that `astro dev start`
# creates. From Airflow containers: host `warehouse`, port 5432.
# From the laptop: localhost:5433 (5432 is already taken by Astro's own metadata DB).
services:
  warehouse:
    image: postgres:16.4
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: ${WAREHOUSE_USER}
      POSTGRES_PASSWORD: ${WAREHOUSE_PASSWORD}
      POSTGRES_DB: ${WAREHOUSE_DB}
    volumes:
      - warehouse-data:/var/lib/postgresql/data
      - ./warehouse/init:/docker-entrypoint-initdb.d
    # Without this, compose puts warehouse on its own auto-created "default"
    # network instead of the "airflow" network Astro's own containers share,
    # so `warehouse:5432` would resolve from the laptop's browser/psql (which
    # only ever use the host port mapping above) but not from inside the
    # Airflow containers themselves.
    networks:
      - airflow

volumes:
  warehouse-data:

networks:
  airflow:
