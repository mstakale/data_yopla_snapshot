# Adds the warehouse Postgres alongside the Airflow containers that `astro dev start`
# creates. From Airflow containers: host `warehouse`, port 5432.
# From the laptop: localhost:5433 (5432 is already taken by Astro's own metadata DB).
services:
  warehouse:
    image: postgres:16.4
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      # Day 5B finding: `astro dev start` does not forward the project's .env
      # into this file's ${VAR} interpolation (plain `docker compose` from
      # this directory does - confirmed directly - so this is specifically
      # an astro-CLI merge-step gap). On a genuinely fresh volume that means
      # Postgres gets empty POSTGRES_PASSWORD and crash-loops
      # ("superuser password is not specified"). This went unnoticed for a
      # long time because an already-initialized volume never re-applies
      # these on restart. Defaults below match .env.example so a fresh clone
      # works either way; still overridable if the interpolation does fire.
      POSTGRES_USER: ${WAREHOUSE_USER:-postgres}
      POSTGRES_PASSWORD: ${WAREHOUSE_PASSWORD:-postgres}
      POSTGRES_DB: ${WAREHOUSE_DB:-warehouse}
    volumes:
      - warehouse-data:/var/lib/postgresql/data
      - ./warehouse/init:/docker-entrypoint-initdb.d
    # Without this, compose puts warehouse on its own auto-created "default"
    # network instead of the "airflow" network Astro's own containers share,
    # so `warehouse:5432` would resolve from the laptop's browser/psql (which
    # only ever use the host port mapping above) but not from inside the
    # Airflow containers themselves.
    networks:
      - airflow

volumes:
  warehouse-data:

networks:
  airflow:
